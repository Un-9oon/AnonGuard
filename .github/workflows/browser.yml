name: Firefox Browser Integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1
        id: firefox
        with:
          firefox-version: latest-esr
      - uses: browser-actions/setup-geckodriver@fac5b0424c584257f32cf12c5eb4ba86014c34f8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: python -m pip install selenium==4.31.0
      - name: Run actual browser against local fixtures
        env:
          ANONGUARD_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: python scripts/test_browser_live.py
      - name: Verify loaded policy and actual preference locks
        env:
          ANONGUARD_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
        run: python scripts/test_browser_policy_live.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify Firefox through real pinned onion testnet
        env:
          ANONGUARD_FIREFOX: ${{ steps.firefox.outputs.firefox-path }}
          ANONGUARD_BROWSER_TESTNET: '1'
        run: cargo test --locked --test test_daemon_testnet padded_cli_testnet_transfers_and_closes_after_relay_loss -- --exact --nocapture
      - name: Install namespace capture tools on disposable runner
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables tcpdump
      - name: Verify generated native firewall and crash refusal in private namespace
        run: sudo python3 scripts/test_native_namespace.py
