name: Release & Multi-Platform Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  RUSTFLAGS: "-D warnings"

jobs:
  build-linux:
    name: Build Linux Binary & Debian Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked

      - name: Build Debian Package & Release Binary with SBOM
        run: |
          chmod +x scripts/build_deb.sh
          cargo auditable build --release
          ./scripts/build_deb.sh

      - name: Create Linux Tarball & Checksums
        run: |
          mkdir -p target/package_linux
          cp target/release/anonguard-daemon target/package_linux/
          cp contrib/anonguard.default.conf target/package_linux/config.toml
          cp README.md target/package_linux/
          tar -czvf dist/anonguard-linux-amd64.tar.gz -C target/package_linux .
          cd dist && sha256sum anonguard-linux-amd64.tar.gz > anonguard-linux-amd64.tar.gz.sha256

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-dist
          path: dist/*

  build-windows:
    name: Build Windows Executable Bundle
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked

      - name: Build Release Binary with SBOM
        run: cargo auditable build --release

      - name: Package Windows Zip & Checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          New-Item -ItemType Directory -Path target/package_windows -Force
          Copy-Item target/release/anonguard-daemon.exe target/package_windows/
          Copy-Item contrib/anonguard.default.conf target/package_windows/config.toml
          Copy-Item README.md target/package_windows/
          Compress-Archive -Path target/package_windows/* -DestinationPath dist/anonguard-windows-amd64.zip
          Get-FileHash dist/anonguard-windows-amd64.zip -Algorithm SHA256 | Format-List > dist/anonguard-windows-amd64.zip.sha256

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dist
          path: dist/*

  build-macos:
    name: Build macOS Universal Binary
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust targets
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install cargo-auditable
        run: cargo install cargo-auditable --locked

      - name: Build Apple Silicon (ARM64) and Intel (x86_64) with SBOM
        run: |
          cargo auditable build --release --target aarch64-apple-darwin
          cargo auditable build --release --target x86_64-apple-darwin

      - name: Create Universal Binary with Lipo & Checksums
        run: |
          mkdir -p dist target/package_macos
          lipo -create -output target/package_macos/anonguard-daemon \
            target/aarch64-apple-darwin/release/anonguard-daemon \
            target/x86_64-apple-darwin/release/anonguard-daemon
          chmod +x target/package_macos/anonguard-daemon
          cp contrib/anonguard.default.conf target/package_macos/config.toml
          cp README.md target/package_macos/
          tar -czvf dist/anonguard-macos-universal.tar.gz -C target/package_macos .
          cd dist && shasum -a 256 anonguard-macos-universal.tar.gz > anonguard-macos-universal.tar.gz.sha256

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: dist/*

  publish-release:
    name: Publish GitHub Release & Sign Artifacts
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Display Release Files
        run: ls -lh release_assets/

      - name: Generate SHA256SUMS Manifest
        run: |
          cd release_assets
          sha256sum *.tar.gz *.zip *.deb > SHA256SUMS 2>/dev/null || sha256sum * > SHA256SUMS

      - name: Sign Release Assets with Cosign
        if: startsWith(github.ref, 'refs/tags/')
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cd release_assets
          for file in *.tar.gz *.zip *.deb; do
            if [ -f "$file" ]; then
              cosign sign-blob --yes "$file" --bundle "$file.sigstore.json" || true
            fi
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
