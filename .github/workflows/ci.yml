name: Continuous Integration & Verification

on:
  workflow_call:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Test & Clippy Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Check Cargo.lock reproducibility
        run: cargo check --locked --all-targets

      - name: Run Test Suite
        run: cargo test --locked --all-targets --verbose

      - name: Install namespace test prerequisites
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables python3

      - name: Verify protected namespace and crash isolation
        run: sudo env RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" "$(command -v cargo)" test --locked --test namespace_isolation_live -- --ignored

      - name: Run Clippy Linter (Strict Zero-Warning Enforcement - Debug)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Clippy Linter & Build (Strict Zero-Warning Enforcement - Release)
        run: cargo clippy --release --all-targets -- -D warnings && cargo build --release

      - name: Check Benchmark Compilation
        run: cargo bench --no-run

  fuzz:
    name: Run Fuzz Targets (Short Campaign)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Check all fuzz harness APIs before campaigns
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --all-targets

      - name: Replay proof-of-work short-header regression
        run: cargo +nightly fuzz run fuzz_verify_pow fuzz/regressions/verify-pow-short-header.input -- -runs=1

      - name: Run Fuzz Targets
        run: |
          campaign_result=0
          for target in fuzz_target_1 fuzz_consensus_deser fuzz_proxy_node_parse fuzz_onion_cell_parse fuzz_peel_forward fuzz_exit_policy fuzz_decode_extend fuzz_decode_relay_target fuzz_socks5_frame fuzz_verify_pow fuzz_multipath_reassembler; do
            if ! cargo +nightly fuzz run "$target" -- -max_total_time=60; then
              campaign_result=1
            fi
          done
          exit "$campaign_result"

      - name: Preserve fuzz crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  coverage:
    name: Code Coverage Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate Coverage Report
        run: |
          cargo tarpaulin --engine llvm --timeout 120 --out Xml --out Html
          # Verify module-level coverage manually for critical modules
          python scripts/coverage_enforcer.py cobertura.xml
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: |
            cobertura.xml
            tarpaulin-report.html

  platform-build:
    name: Platform compilation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked --all-targets
