name: Continuous Integration & Verification

on:
  workflow_call:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Test & Clippy Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Verify HTTP evaluation and failed-proxy refusal
        run: python3 scripts/test_latency_profile.py

      - name: Check Cargo.lock reproducibility
        run: cargo check --locked --all-targets

      - name: Run Test Suite
        run: cargo test --locked --all-targets --verbose

      - name: Install real obfs4 transport for interoperability verification
        run: sudo apt-get update && sudo apt-get install -y obfs4proxy

      - name: Verify pinned TLS and full CLI testnet through real obfs4
        env:
          ANONGUARD_OBFS4PROXY: /usr/bin/obfs4proxy
        run: |
          cargo test --locked --test test_pluggable_transport -- --ignored
          cargo test --locked --test test_daemon_testnet

      - name: Install namespace test prerequisites
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables python3 procps

      - name: Verify protected namespace and crash isolation
        run: sudo env RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" "$(command -v cargo)" test --locked --test namespace_isolation_live -- --ignored

      - name: Run Clippy Linter (Strict Zero-Warning Enforcement - Debug)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Clippy Linter & Build (Strict Zero-Warning Enforcement - Release)
        run: cargo clippy --release --all-targets -- -D warnings && cargo build --release

      - name: Check Benchmark Compilation
        run: cargo bench --no-run

      - name: Build Debian package from verified binary
        run: bash scripts/build_deb.sh --prebuilt

      - name: Verify Debian install and configuration recovery on disposable runner
        run: sudo env ANONGUARD_DISPOSABLE_PACKAGE_TEST=1 bash scripts/test_deb_lifecycle.sh dist/anonguard_*.deb

  app-containment:
    name: Linux Headless Application Containment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install containment test prerequisites
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables python3 bubblewrap libseccomp2 gcc libc6-dev util-linux strace apparmor
      - name: Load executable-specific namespace policy with AppArmor restrictions retained
        run: |
          sudo apparmor_parser -r deploy/apparmor/anonguard-bwrap
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
      - name: Verify launcher and loaded syscall policy
        run: python3 scripts/test_app_launcher.py
      - name: Verify privileged headless boundaries and helper death
        run: sudo env ANONGUARD_DISPOSABLE_APP_TEST=1 python3 scripts/test_app_containment_live.py

  fuzz:
    name: Run Fuzz Targets (Short Campaign)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Check all fuzz harness APIs before campaigns
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --all-targets

      - name: Replay proof-of-work short-header regression
        run: cargo +nightly fuzz run fuzz_verify_pow fuzz/regressions/verify-pow-short-header.input -- -runs=1

      - name: Run Fuzz Targets
        run: |
          campaign_result=0
          for target in fuzz_target_1 fuzz_consensus_deser fuzz_proxy_node_parse fuzz_onion_cell_parse fuzz_peel_forward fuzz_exit_policy fuzz_decode_extend fuzz_decode_relay_target fuzz_socks5_frame fuzz_verify_pow fuzz_multipath_reassembler; do
            if ! cargo +nightly fuzz run "$target" -- -max_total_time=60; then
              campaign_result=1
            fi
          done
          exit "$campaign_result"

      - name: Preserve fuzz crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  coverage:
    name: Code Coverage Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Install namespace coverage prerequisites
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables python3 procps

      - name: Verify coverage aggregation
        run: python3 scripts/test_merge_coverage.py

      - name: Generate normal coverage report
        run: cargo tarpaulin --engine llvm --locked --timeout 120 --out Xml --out Html --output-dir coverage-normal

      - name: Measure privileged namespace isolation
        run: sudo env PATH="$PATH" RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" "$(command -v cargo-tarpaulin)" --engine llvm --skip-clean --locked --timeout 120 --test namespace_isolation_live --ignored --out Xml --out Html --output-dir coverage-namespace

      - name: Combine measured line coverage and enforce release gates
        run: |
          python3 scripts/merge_coverage.py cobertura.xml coverage-normal/cobertura.xml coverage-namespace/cobertura.xml
          python3 scripts/coverage_enforcer.py cobertura.xml
      
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: |
            cobertura.xml
            coverage-normal/
            coverage-namespace/

  platform-build:
    name: Platform compilation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked --all-targets
