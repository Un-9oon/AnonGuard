name: Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Test & Clippy Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Check Cargo.lock reproducibility
        run: cargo check --locked --all-targets

      - name: Run Test Suite
        run: cargo test --all-targets --verbose

      - name: Run Clippy Linter (Strict Zero-Warning Enforcement - Debug)
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Clippy Linter & Build (Strict Zero-Warning Enforcement - Release)
        run: cargo clippy --release --all-targets -- -D warnings && cargo build --release

      - name: Check Benchmark Compilation
        run: cargo bench --no-run
