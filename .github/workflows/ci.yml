name: Continuous Integration & Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: Test & Clippy Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Check Cargo.lock reproducibility
        run: cargo check --locked --all-targets

      - name: Run Test Suite
        run: cargo test --locked --all-targets --verbose

      - name: Install namespace test prerequisites
        run: sudo apt-get update && sudo apt-get install -y iproute2 nftables python3

      - name: Verify protected namespace and crash isolation
        run: sudo env RUSTUP_HOME="$HOME/.rustup" CARGO_HOME="$HOME/.cargo" "$(command -v cargo)" test --locked --test namespace_isolation_live -- --ignored

      - name: Run Clippy Linter (Strict Zero-Warning Enforcement - Debug)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run Clippy Linter & Build (Strict Zero-Warning Enforcement - Release)
        run: cargo clippy --release --all-targets -- -D warnings && cargo build --release

      - name: Check Benchmark Compilation
        run: cargo bench --no-run

  fuzz:
    name: Run Fuzz Targets (Short Campaign)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Run Fuzz Targets
        run: |
          cargo +nightly fuzz run fuzz_target_1 -- -max_total_time=60
          cargo +nightly fuzz run fuzz_consensus_deser -- -max_total_time=60
          cargo +nightly fuzz run fuzz_proxy_node_parse -- -max_total_time=60
          cargo +nightly fuzz run fuzz_onion_cell_parse -- -max_total_time=60
          cargo +nightly fuzz run fuzz_peel_forward -- -max_total_time=60
          cargo +nightly fuzz run fuzz_exit_policy -- -max_total_time=60
          cargo +nightly fuzz run fuzz_decode_extend -- -max_total_time=60
          cargo +nightly fuzz run fuzz_decode_relay_target -- -max_total_time=60
          cargo +nightly fuzz run fuzz_socks5_frame -- -max_total_time=60
          cargo +nightly fuzz run fuzz_verify_pow -- -max_total_time=60
          cargo +nightly fuzz run fuzz_multipath_reassembler -- -max_total_time=60

  coverage:
    name: Code Coverage Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Generate Coverage Report
        run: |
          cargo tarpaulin --out Xml --out Html
          # Verify module-level coverage manually for critical modules
          python scripts/coverage_enforcer.py cobertura.xml
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: |
            cobertura.xml
            tarpaulin-report.html

  platform-build:
    name: Platform compilation
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --locked --all-targets
