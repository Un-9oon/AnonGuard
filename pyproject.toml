[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anonguard"
version = "0.1.0"
description = "Cross-Layer Anonymity and Anti-Attribution Engine with Zero-Leak Guarantees"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "AnonGuard Research Group" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Internet :: Proxy Servers",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests>=2.28.0",
    "urllib3>=1.26.0",
]

[project.optional-dependencies]
socks = ["PySocks>=1.7.1"]
tls = ["curl_cffi>=0.5.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["python/research_benchmarks"]
python_files = ["*.py"]
