# AnonGuard Configuration File
# Installed to /etc/anonguard/config.toml

# Gateway listener address
listen_addr = "127.0.0.1:9050"

# Fail-closed kill switch: terminate all traffic if proxy drops
strict_killswitch = true

# Enforce remote DNS resolution (SOCKS5h) to prevent ISP DNS leaks
enforce_remote_dns = true

# Block dual-stack IPv6 to prevent attribution leaks
disable_ipv6 = true

# Enable 3-hop layered onion routing
enable_onion_routing = true

# Enforce BGP /16 subnet diversity across circuit hops (Sybil resistance)
enforce_subnet_diversity = true

# Enable Quantum Chaos (Q-RMT) Traffic Morphing using the Wigner Surmise
enable_quantum = true
quantum_ensemble = "goe"

# Obfuscation fallback modes
enable_chaos = false
enable_jitter = false
jitter_lambda = 0.05

# TLS JA4 browser fingerprint emulation
ja4_profile = "chrome_120"
