[package]
name = "anonguard"
version = "0.2.0"
rust-version = "1.81"
edition = "2021"
authors = ["AnonGuard Research Group"]
description = "Cross-Layer Anonymity and Anti-Attribution Engine with Zero-Leak Guarantees"
license = "MIT OR Apache-2.0"

[lib]
name = "anonguard"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "anonguard-daemon"
path = "src/main.rs"

[[bench]]
name = "crypto_bench"
harness = false

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.6"
url = "2.5"

# Cryptography & Hashing
sha2 = "=0.10.9"
rand = "0.8"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
chacha20 = "0.9"
poly1305 = "0.8"
chacha20poly1305 = "=0.10.1"
subtle = "2.6"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }

# Error handling
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Optional Python Bindings (PyO3)
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"], optional = true }
hmac = "0.12"
hkdf = "0.12"

[features]
default = []
python = ["dep:pyo3"]

[dev-dependencies]
criterion = "0.8.2"
tokio-test = "0.4"
