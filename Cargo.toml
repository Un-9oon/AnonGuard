[package]
name = "anonguard"
version = "0.2.0"
rust-version = "1.88"
edition = "2021"
authors = ["AnonGuard Research Group"]
description = "Experimental authenticated onion-routing gateway"
license = "MIT OR Apache-2.0"

[lib]
name = "anonguard"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "anonguard-daemon"
path = "src/main.rs"

[[bin]]
name = "anonymity-set-calc"
path = "tools/anonymity_set_calc.rs"

[[bin]]
name = "generate-traffic-dataset"
path = "tools/traffic_classifier_eval/generate_dataset.rs"

[[bin]]
name = "ja4-anonymity-calc"
path = "tools/ja4_anonymity_calc.rs"

[[bench]]
name = "crypto_bench"
harness = false

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.38", features = ["full"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
rcgen = { version = "0.13.2", default-features = false, features = ["crypto", "ring"] }
x509-parser = "0.18"
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.6"
url = "2.5"

# Cryptography & Hashing
sha2 = "=0.10.9"
rand = "0.8"
rand_distr = "0.4"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
chacha20 = "0.9"
chacha20poly1305 = "=0.10.1"


subtle = "2.6"
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }
zeroize = { version = "1.8", features = ["derive"] }
ml-kem = "0.2"

# Error handling
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
metrics = "0.23"
metrics-exporter-prometheus = "0.15"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Optional Python Bindings (PyO3)
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py310"], optional = true }
hmac = "0.12"
hkdf = "0.12"
indexmap = "2"
hex = "0.4.3"
futures = "0.3.34"

[features]
default = []
python = ["dep:pyo3"]

[dev-dependencies]
criterion = "0.8.2"
loom = "0.7.2"
tokio-test = "0.4"
[[test]]
name = "test_adversarial_robustness"
path = "tests/test_adversarial_robustness.rs"
