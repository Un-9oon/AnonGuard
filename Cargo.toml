[package]
name = "anonguard"
version = "0.1.0"
edition = "2021"
authors = ["AnonGuard Research Group"]
description = "Cross-Layer Anonymity and Anti-Attribution Engine with Zero-Leak Guarantees"
license = "MIT OR Apache-2.0"

[lib]
name = "anonguard"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "anonguard-daemon"
path = "src/main.rs"

[dependencies]
# Async Runtime & Networking
tokio = { version = "1.38", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1.6"
url = "2.5"

# Cryptography & Hashing
sha2 = "0.10"
rand = "0.8"

# Error handling
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Optional Python Bindings (PyO3)
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py310"], optional = true }

[features]
default = []
python = ["dep:pyo3"]

[dev-dependencies]
tokio-test = "0.4"
